title: Suspicious Encoded PowerShell Command Line
id: bb575d6c-2f4d-4594-bc11-4f79a78250bf
status: experimental
description: >
  Detects PowerShell executed with an encoded command flag (-EncodedCommand / -enc),
  a common obfuscation technique for hiding malicious payloads.
author: hokage_787
date: 2026/10/05
references:
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -EncodedCommand'
      - ' -enc '
      - ' -e '
  condition: selection_img and selection_cli
falsepositives:
  - Administrative scripts that legitimately use encoded commands
  - Software installers wrapping PowerShell payloads
level: medium
tags:
  - attack.execution
  - attack.t1059.001
